[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "materials-ml-tools"
version = "0.1.0"
description = "Model-agnostic evaluation utilities for machine-learning interatomic potentials"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
